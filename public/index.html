<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance Logger</title>

  <style>
    /* 🌿 Basic Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #f4f7f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 40px 20px;
    }

    h1 {
      color: #333;
      margin-bottom: 25px;
      text-align: center;
      font-size: 2rem;
      letter-spacing: 1px;
    }

    /* 🌼 Card-like container */
    div {
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 500px;
      text-align: center;
      margin-bottom: 30px;
    }

    /* 🧾 Output list */
    .item-list {
      list-style: none;
      margin-top: 20px;
      text-align: left;
    }

    .item-list li {
      background: #e8f0fe;
      margin-bottom: 10px;
      padding: 10px 15px;
      border-radius: 6px;
      color: #333;
    }

    /* 📋 Form Styling */
    footer {
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 500px;
    }

    .field {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 5px;
      color: #333;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      transition: all 0.2s ease;
    }

    input:focus, select:focus {
      border-color: #3b82f6;
      outline: none;
      box-shadow: 0 0 5px rgba(59, 130, 246, 0.3);
    }

    button {
      background: #3b82f6;
      color: white;
      padding: 12px 15px;
      border: none;
      border-radius: 6px;
      width: 100%;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>

  <div>
    <h1>Finance Logger</h1>
    <!-- Output list -->
    <ul class="item-list"></ul>
  </div>

  <footer>
    <form class="new-item-form">
      <div class="field">
        <label>Type:</label>
        <select id="type">
          <option value="invoice">Invoice</option>
          <option value="payment">Payment</option>
        </select>
      </div>

      <div class="field">
        <label>To / From:</label>
        <input type="text" id="toFrom">
      </div>

      <div class="field">
        <label>Details:</label>
        <input type="text" id="details">
      </div>

      <div class="field">
        <label>Amount ($):</label>
        <input type="number" id="amount">
      </div>

      <button>Add</button>
    </form>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
